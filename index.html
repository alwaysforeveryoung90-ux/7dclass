<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГЛАВНЫЙ СЫН ШЛЮХИ</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        .photo {
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Стрелка, указывающая прямо в ебало */
        .arrow {
            position: absolute;
            bottom: 40px;
            right: -120px;
            font-size: 50px;
            color: #ff0000;
            transform: rotate(-20deg);
            font-weight: bold;
            text-shadow: 2px 2px 5px #000;
        }

        .text {
            position: absolute;
            bottom: 10px;
            right: -260px;
            font-size: 24px;
            color: #ff0000;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 2px 2px 5px #000;
            border: 2px solid #ff0000;
            padding: 5px 15px;
            background-color: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Замени photo.jpg на имя твоего файла с картинкой, если оно другое -->
        <img src="photo.jpg" alt="Фото" class="photo">
        <!-- Стрелка (используем спецсимвол) -->
        <div class="arrow">↖</div>
        <!-- Надпись -->
        <div class="text">ГЛАВНЫЙ СЫН ШЛЮХИ!</div>
    </div>

</body>
</html>
