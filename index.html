<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГЛАВНЫЙ СЫН ШЛЮХИ</title>
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        .photo {
            max-width: 600px;
            border-radius: 10px;
            display: block;
        }

        /* Стрелка, указывающая прямо в ебало сверху */
        .arrow {
            position: absolute;
            top: -50px; /* Поднимаем стрелку над фото */
            left: 40%;
            font-size: 60px;
            color: #ff0000;
            transform: rotate(20deg);
            text-shadow: 2px 2px 5px #000;
        }

        /* Надпись поверх фото */
        .text {
            position: absolute;
            top: 10px; /* Текст на самом верху */
            left: 50%;
            transform: translateX(-50%); /* Центрируем */
            font-size: 30px;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; /* Обводка, чтоб читалось */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Убедись, что файл называется photo.jpg и лежит рядом с этим html -->
        <img src="photo.jpg" alt="ГЛАВНЫЙ СЫН ШЛЮХИ" class="photo">
        
        <div class="arrow">↙</div>
        <div class="text">ГЛАВНЫЙ СЫН ШЛЮХИ!</div>
    </div>

</body>
</html>
